---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    target-branch: release-0.17
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    target-branch: release-0.18
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    target-branch: release-0.19
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    target-branch: release-0.20
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    target-branch: release-0.21
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns:
          - '*'
    ignore:
      # Our own dependencies are handled during releases
      - dependency-name: github.com/submariner-io/*
      # Managed in admiral
      - dependency-name: github.com/go-logr/logr
      - dependency-name: github.com/onsi/ginkgo/v2
      - dependency-name: github.com/onsi/gomega
      - dependency-name: github.com/pkg/errors
      - dependency-name: k8s.io/api
      - dependency-name: k8s.io/apimachinery
      - dependency-name: k8s.io/client-go
      - dependency-name: k8s.io/utils
      - dependency-name: sigs.k8s.io/controller-runtime
      # Managed in cloud-prepare
      - dependency-name: google.golang.org/api
      # Managed in lighthouse
      - dependency-name: sigs.k8s.io/mcs-api
      # Managed in submariner
      - dependency-name: golang.org/x/net
      # Managed in submariner-operator
      - dependency-name: github.com/coreos/go-semver
      - dependency-name: github.com/openshift/api
      - dependency-name: k8s.io/apiextensions-apiserver
      - dependency-name: sigs.k8s.io/yaml
